# The core's own workspace. The example app is not in it on purpose: it installs the core from its GitHub release,
# exactly as Argus, Galen and Aristotle will, so what it proves is what they will get.
packages:
  - packages/*
onlyBuiltDependencies: []
# Mermaid asks for a KaTeX of its own (0.16 or 0.18); it is given the core's, so there is one copy in a bundle and
# `pnpm audit` is clean. An override only counts at the root of an install: each app keeps the same line in its own
# package.json (Galen's and Aristotle's have it).
overrides:
  mermaid>katex: ^0.19.0
