<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Organon: the shared core of the saga's apps">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#141416"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2c2c2f"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="18" fill="url(#dots)" opacity="0.45"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="17.5" fill="none" stroke="#2c2c2f"/>

  <!-- The mark: one core, and the apps it reaches, each on its own line. -->
  <g transform="translate(300 210)" stroke-linecap="round">
    <g fill="none" stroke="#ececec" stroke-width="5">
      <path d="M0 0 L0 -118" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.125;0.6875;1" dur="1.6s" calcMode="spline" keySplines="0 0 1 1;0.35 0 0.25 1;0 0 1 1" fill="freeze"/></path>
      <path d="M0 0 L102 59" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.281;0.8435;1" dur="1.6s" calcMode="spline" keySplines="0 0 1 1;0.35 0 0.25 1;0 0 1 1" fill="freeze"/></path>
      <path d="M0 0 L-102 59" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="100;100;0" keyTimes="0;0.4375;1" dur="1.6s" calcMode="spline" keySplines="0 0 1 1;0.35 0 0.25 1" fill="freeze"/></path>
    </g>
    <g fill="#141416" stroke="#ececec" stroke-width="5">
      <circle cx="0" cy="-118" r="17"/>
      <circle cx="102" cy="59" r="17"/>
      <circle cx="-102" cy="59" r="17"/>
    </g>
    <circle r="30" fill="#d6a24e"/>
    <circle r="11" fill="#141416"/>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="495" y="178" font-size="88" font-weight="700" letter-spacing="-3" fill="#ececec">Organon</text>
    <text x="499" y="230" font-size="27" font-weight="500" fill="#a6a6a6">The shared core of the saga’s apps.</text>
    <line x1="499" y1="272" x2="559" y2="272" stroke="#d6a24e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="499" y="314" font-size="20" font-style="italic" fill="#a6a6a6">“Certain things being stated, something other than what is stated</text>
    <text x="499" y="342" font-size="20" font-style="italic" fill="#a6a6a6">follows of necessity from their being so.”</text>
    <text x="499" y="374" font-size="15" letter-spacing="0.4" fill="#6f6f73">Aristotle, Prior Analytics I.1 (tr. A. J. Jenkinson)</text>
  </g>
</svg>
